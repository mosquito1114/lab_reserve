# ============================================================
# lab_reserve Redis 配置
#
# ⚠️ 密码不写在本文件里（本文件要提交到 Git）。
#    由 docker-compose 启动时通过 --requirepass 注入容器环境变量 REDIS_PASSWORD。
# ============================================================

bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

# ------------------------------------------------------------
# 持久化：AOF 必须开启
#
# 邮件投递队列用 Redis Stream（msg:email）。如果 Redis 重启丢队列，
# 待发邮件会永久丢失，且"失败自动重发"的需求无法满足。
# ------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 作为兜底快照
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb

# ------------------------------------------------------------
# 内存策略
#
# ⚠️ 必须是 noeviction：本项目的 Key（排队 ZSet、收件箱 ZSet、消息未读数、
#    候补 deadline ZSet）都是"业务数据"而非"缓存"，被淘汰会导致数据错乱。
# ------------------------------------------------------------
maxmemory 256mb
maxmemory-policy noeviction

# ------------------------------------------------------------
# Stream
# ------------------------------------------------------------
stream-node-max-bytes 4096
stream-node-max-entries 1000

# ------------------------------------------------------------
# 日志与诊断
# ------------------------------------------------------------
loglevel notice
logfile ""
databases 16

slowlog-log-slower-than 10000
slowlog-max-len 128

latency-monitor-threshold 100

# ------------------------------------------------------------
# 客户端
# ------------------------------------------------------------
maxclients 1000

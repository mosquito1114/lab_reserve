# ============================================================
# 开发环境（默认 profile）
#
# 用本地或 Docker 里的中间件：
#   docker compose up -d mysql redis
# 然后直接 ./mvnw spring-boot:run
#
# 连接参数来自 .env（MYSQL_HOST 默认 localhost）。
# ============================================================

spring:
  # 开发期把 SQL 打到控制台，方便排查判冲与排队相关的 SQL
  datasource:
    hikari:
      maximum-pool-size: 10

# ============================================================
# RAG 开关（开发期）
#
# 默认**关闭**，与基础 application.yml 保持一致（`${RAG_ENABLED:false}`）。
# 需要启用时在 .env 里显式设：
#     RAG_ENABLED=true
#     LLM_API_KEY=sk-xxx              # 百炼 / DashScope
#     LLM_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
#     LLM_CHAT_MODEL=qwen-plus
#     LLM_EMBEDDING_MODEL=text-embedding-v3
# 并保证 qdrant 容器在跑（docker compose up -d qdrant）。
#
# 为什么默认关：RAG 依赖外部 LLM + 向量库，没有凭据时开启只会满屏
# 连接警告 / 问答 401，对新拉代码的协作者不友好。
# ============================================================
lab-reserve:
  rag:
    enabled: ${RAG_ENABLED:false}

mybatis-plus:
  configuration:
    # 控制台输出执行的 SQL 与参数
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: info
    com.labreserve: debug
    # 打印 Mapper 层 SQL
    com.labreserve.mapper: debug
    org.springframework.jdbc.core: debug
    com.labreserve.rag: debug             # RAG 子包独立日志级别
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

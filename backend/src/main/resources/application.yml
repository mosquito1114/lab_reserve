server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
  # 让 request.getRemoteAddr() 尊重 X-Forwarded-For —— 操作日志要记真实客户端 IP
  forward-headers-strategy: framework
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: lab-reserve
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ------------------------------------------------------------
  # Jackson
  # ------------------------------------------------------------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

  # ------------------------------------------------------------
  # MySQL
  # ------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lab_reserve}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true&allowMultiQueries=true
    username: ${MYSQL_USER:lab_reserve}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: LabReserveHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ------------------------------------------------------------
  # Flyway：表结构由它负责，脚本在 db/migration 下
  # ------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    encoding: UTF-8

  # ------------------------------------------------------------
  # 文件上传（故障截图，后端中转后转存 OSS）
  # ------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 25MB

  # ------------------------------------------------------------
  # SMTP 邮件（迭代 3 使用）
  # ------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# ============================================================
# MyBatis-Plus
#
# 不使用 table-prefix 自动拼前缀：所有实体的 @TableName 都显式写全名
# （tb_xxx），避免前缀规则与显式注解叠加导致表名错误。
# 也不使用 @TableLogic 全局逻辑删除，见 design.md §1.3。
# ============================================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.labreserve.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      table-underline: true

# ============================================================
# 阿里云 OSS
# ============================================================
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    custom-domain: ${OSS_CUSTOM_DOMAIN:}
    dir-prefix: ${OSS_DIR_PREFIX:lab-reserve}
    max-size: 5242880

# ============================================================
# 业务参数（对应 agents/req.md 的问答结论）
# ============================================================
lab-reserve:
  version: 0.1.0
  jwt:
    secret: ${JWT_SECRET:lab-reserve-default-secret-please-change-me-in-env-file}
    access-expire-seconds: ${JWT_ACCESS_EXPIRE:7200}
    refresh-expire-seconds: ${JWT_REFRESH_EXPIRE:604800}
  queue:
    # 候补确认时限（分钟）—— 需求 Q18，演示时可临时改成 0.5
    candidate-timeout-minutes: 30
    # 候补放弃 / 超时后的排队禁入天数 —— 需求 Q17
    ban-days: 7
  reservation:
    # 发起调整申请需提前的小时数 —— 需求 Q13
    change-ahead-hours: 24
  mail:
    from-name: ${MAIL_FROM_NAME:实验室预约管理系统}
    # 邮件投递最大重试次数，超过进死信队列
    max-retry: 3
  sensitive:
    # 允许查看完整手机号的角色（脱敏例外，必须写操作日志）
    reveal-roles: SYS_ADMIN,LAB_ADMIN

# ============================================================
# 接口文档
# ============================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json

knife4j:
  enable: true
  setting:
    language: zh_cn

# ============================================================
# 日志
# ============================================================
logging:
  level:
    root: info
    com.labreserve: debug
    com.baomidou.mybatisplus: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n"
